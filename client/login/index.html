<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue+Sans&family=Fredoka+One&family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <a id="backButton" href="../homepage/index.html">Back</a>

    <section id="loginSection">
        <form id="login-form">
            <h1>Login</h1>

            <fieldset>
                <label for="email">School email:</label>
                <input type="text" id="email" name="email" required>
            </fieldset>

            <fieldset>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </fieldset>
            <input type="submit" value="Log in">

            <p id="signupText">No account? <a id="signupLink" href="../signup/index.html">Sign up here</a>.</p>
        </form>
    </section>
</body>
</html>
