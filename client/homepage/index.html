<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue+Sans&family=Fredoka+One&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script defer src="index.js"></script>
    <title>Homepage</title>
  </head>
  <body>
    <div id="top-bar">
      <div id="streak">
        <p>🔥 100</p>
      </div>
      <div>
        <button id="logout">Log out</button>
      </div>
    </div>
    <div id="page">

      <div id="welcome-message" class="welcome-message"></div>

    <div class="topic-row">
      <div id="topic-1" class="topic">
        <div class="icon-container">
          <div class="icon">
            <img src="assets/egypt.jpg" alt="ancient egypt" />
          </div>
        </div>
        <div class="options">
        <button class="practice" data-topic="ancient_egypt">
          <p>Practice</p>
        </button>
        <button class="challenge" data-topic="ancient_egypt">
            <p>Challenge</p>
        </button>
        <button class="scores" data-topic="ancient_egypt">
            <p>Scores</p>
        </button>
        </div>
      </div>
      <div id="topic-2" class="topic">
        <div class="icon-container">
          <div class="icon">
            <img src="assets/greece.jpg" alt="ancient greece" />
          </div>
        </div>
        <div class="options">
        <button class="practice" data-topic="ancient_greece">
          <p>Practice</p>
        </button>
        <button class="challenge" data-topic="ancient_greece">
            <p>Challenge</p>
        </button>
        <button class="scores" data-topic="ancient_greece">
            <p>Scores</p>
        </button>
        </div>
      </div>
      </div>


      <div class="topic-row">
      <div id="topic-3" class="topic">
        <div class="icon-container">
          <div class="icon">
            <img src="assets/castle.jpg" alt="king" />
          </div>
        </div>
        <div class="options">
        <button class="practice" data-topic="tudors">
          <p>Practice</p>
        </button>
        <button class="challenge" data-topic="tudors">
            <p>Challenge</p>
        </button>
        <button class="scores" data-topic="tudors">
            <p>Scores</p>
        </button>
        </div>
      </div>
      <div id="topic-4" class="topic">
        <div class="icon-container">
          <div class="icon">
            <img src="assets/suffragette.jpg" alt="suffragette" />
          </div>
        </div>
        <div class="options">
        <button class="practice" data-topic="suffragettes">
          <p>Practice</p>
        </button>
        <button class="challenge" data-topic="suffragettes">
            <p>Challenge</p>
        </button>
        <button class="scores" data-topic="suffragettes">
            <p>Scores</p>
        </button>
        </div>
      </div>
      </div>
    <div id="navbar">
        <a href="#" id="profile">Profile</a>
        <a href="../leaderboard/index.html" id="leaderboard">Leaderboard</a>
    </div>
  </body>
</html>
