<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="index.js"></script>
    <title>Homepage</title>
  </head>
  <body>
    <div id="top-bar">
      <div id="streak">
        <p>🔥 100</p>
      </div>
      <div id="logout-button">
        <button id="logout">Log out</button>
      </div>
    </div>

    <div id="topic-1" class="topic">
      <div class="icon-container">
        <div class="icon">
          <img src="assets/suffragette.jpg" alt="suffragette" />

      </div>
      <div class="practice"></div>
      <div class="challenge"></div>
      <div class="scores"></div>
    </div>

    <div id="topic-2" class="topic">
      <div class="icon-container">
        <div class="icon">
          <img src="assets/viking.jpg" alt="viking" />
        </div>
      </div>
      <div class="practice"></div>
      <div class="challenge"></div>
      <div class="scores"></div>
    </div>

    <div id="topic-3" class="topic">
      <div class="icon-container">
        <div class="icon">
          <img src="assets/king.png" alt="king" />
        </div>
      </div>
      <div class="practice"></div>
      <div class="challenge"></div>
      <div class="scores"></div>
    </div>

    <div id="navbar"></div>
  </body>
</html>
