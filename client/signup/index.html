<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="index.js"></script>
    <title>Signup quiz</title>
</head>
<body>
    <div class="quiz-container">
        <h1>Let's set up your account!</h1>
        <div id="quiz-questions">
            <div class="question active" id="q1">
                <h2>What's your username?</h2>
                <input type="text" id="username" placeholder="Choose a username...">
                <button class="next-btn" id="next-btn-1">Next</button>
            </div>

            <div class="question" id="q2">
                <h2>Create a password</h2>
                <input type="password" id="password" placeholder="Keep it secret!">
                <button class="next-btn" id="next-btn-2">Next</button>
            </div>

            <div class="question" id="q3">
                <h2>What's your school email?</h2>
                <input type="text" id="email" placeholder="Enter your email...">
                <button class="next-btn" id="next-btn-3">Next</button>
            </div>

            <div class="question" id="q4">
                <h2>Pick a colour theme!</h2>
                <div class="colour-options">
                    <button class="colour-swatch" id="dark-btn">Dark</button>
                    <button class="colour-swatch" id="light-btn">Light</button>
                    <button class="colour-swatch" id="ocean-btn">Ocean</button>
                    <button class="colour-swatch" id="forest-btn">Forest</button>
                    <button class="colour-swatch" id="sunset-btn">Sunset</button>
                </div>
                <button class="next-btn" id="finish-btn">Finish!</button>
            </div>
        </div>
    </div>

    <div class="login-link-container">
    <p>Already have an account?</p>
    <button id="login-btn">Log in</button>
  </div>
</body>
</html>
